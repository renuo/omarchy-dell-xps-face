<g font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11" fill="#e6e9ef">
<text x="62" y="66"><tspan fill="#8bd5a0">$</tspan> sudo pacman -Syu</text>
<text x="62" y="88">Press the Copilot key to use your</text>
<text x="62" y="103">face, or type your password.</text>
<text x="62" y="124">[sudo] password for you:</text>
<rect x="228" y="115" width="6" height="11" fill="#e6e9ef"/>
<text x="62" y="146" fill="#ffb454">Scanning face…</text>
<text x="62" y="167" fill="#8bd5a0">Identified face as you</text>
</g></g>
