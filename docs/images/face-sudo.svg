<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" role="img" aria-labelledby="t d">
<title id="t">sudo with the Copilot key</title>
<desc id="d">A person presses the Copilot key on a laptop whose terminal shows sudo's prompt with the face hint; the IR camera scans their face.</desc>
<defs>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="display"><rect x="52" y="44" width="256" height="154" rx="4"/></clipPath>
</defs>
<rect x="1" y="1" width="558" height="338" rx="18" fill="#f3f5f9" stroke="#dfe4ec"/>
<rect x="40" y="30" width="280" height="182" rx="12" fill="#2b303b"/>
