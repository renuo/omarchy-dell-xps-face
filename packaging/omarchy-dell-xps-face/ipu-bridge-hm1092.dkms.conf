PACKAGE_NAME="ipu-bridge-hm1092"
PACKAGE_VERSION="@PKGVER@"
BUILT_MODULE_NAME[0]="ipu-bridge"
DEST_MODULE_LOCATION[0]="/updates"
AUTOINSTALL="yes"
BUILD_EXCLUSIVE_KERNEL="^7\.2\."
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

# linux-omarchy dropped the sensor from ipu-bridge in 7.2.14 because it breaks
# IPU6 Latitudes. dkms sources this file, so a kernel that lists the sensor
# again skips the override the way it skips any other excluded kernel.
in_tree="/usr/lib/modules/${kernelver}/kernel/drivers/media/pci/intel/ipu-bridge.ko.zst"
if [[ -f $in_tree ]] && zstdcat "$in_tree" | grep -qa HIMX1092; then
  BUILD_EXCLUSIVE_KERNEL="^kernel-lists-HIMX1092$"
fi
